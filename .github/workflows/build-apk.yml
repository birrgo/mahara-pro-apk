Name: Convert PWA to Release AAB (Mahara Pro)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: "Mahara Pro"
  PACKAGE_NAME: "com.maharapro.app"
  # Replace with the actual AdMob App ID for Mahara Pro if different
  ADMOB_APP_ID: "ca-app-pub-1118823918279022~3890936630" 
  # --- EDIT APP VERSION HERE ---
  APP_VERSION: "1.0.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Esbuild
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          # Added @capacitor/app and @capacitor/network for Back Button and Offline functionality
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/splash-screen@8 @capacitor/app@8 @capacitor/network@8 capacitor-admob-nextgen@1.2.9 @onesignal/capacitor-plugin esbuild

      - name: Initialize AdMob SDK Variables
        run: |
          node -e "
          const fs = require('fs');
          let pkg = JSON.parse(fs.readFileSync('package.json'));
          pkg.admob = {
            androidAppId: '${{ env.ADMOB_APP_ID }}',
            enableNativeAds: { android: true } 
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Bundle Web Files & Compile Native Bridge
        run: |
          rm -rf www
          mkdir -p www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' --exclude='node_modules' ./ www/

          # Create Native Bridge JS with Back Button and Offline Logic
          cat << 'EOF' > bridge.js
          import { Capacitor } from '@capacitor/core';
          import { AdMobNextGen } from 'capacitor-admob-nextgen';
          import OneSignalPlugin from '@onesignal/capacitor-plugin';
          import { App } from '@capacitor/app';
          import { Network } from '@capacitor/network';

          window.Capacitor = Capacitor;
          window.AdMobPlugin = AdMobNextGen;
          window.OneSignal = OneSignalPlugin.default || OneSignalPlugin;

          // --- 1. HARDWARE BACK BUTTON FIX ---
          App.addListener('backButton', ({ canGoBack }) => {
            if (canGoBack) {
              window.history.back();
            } else {
              App.exitApp();
            }
          });

          // --- 2. OFFLINE / LOW CONNECTION POPUP ---
          const checkNetwork = async () => {
            const status = await Network.getStatus();
            const existing = document.getElementById('capacitor-offline-overlay');
            
            if (!status.connected) {
              if (!existing) {
                const overlay = document.createElement('div');
                overlay.id = 'capacitor-offline-overlay';
                overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:999999;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:sans-serif;color:#fff;';
                overlay.innerHTML = `
                  <div style="background:#222;padding:30px;border-radius:12px;text-align:center;width:80%;max-width:320px;box-shadow:0 4px 15px rgba(0,0,0,0.5);">
                    <h2 style="margin:0 0 10px;font-size:22px;">Offline</h2>
                    <p style="margin:0 0 25px;font-size:15px;color:#ddd;">Please check your internet connection and try again.</p>
                    <button id="retry-network-btn" style="background:#007bff;color:#fff;border:none;padding:12px 24px;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;width:100%;">Try Again</button>
                  </div>
                `;
                document.body.appendChild(overlay);

                document.getElementById('retry-network-btn').addEventListener('click', async () => {
                  const currentStatus = await Network.getStatus();
                  if (currentStatus.connected) {
                    overlay.remove();
                    window.location.reload();
                  } else {
                    const btn = document.getElementById('retry-network-btn');
                    btn.innerText = 'Still Offline...';
                    setTimeout(() => { btn.innerText = 'Try Again'; }, 1500);
                  }
                });
              }
            } else if (existing) {
              existing.remove();
            }
          };

          // Monitor network changes
          Network.addListener('networkStatusChange', checkNetwork);
          
          // Check network when DOM is loaded
          window.addEventListener('DOMContentLoaded', checkNetwork);
          EOF

          npx esbuild bridge.js --bundle --minify --outfile=www/native-bridge.js

      - name: Create Capacitor Config
        run: |
          echo '{' > capacitor.config.json
          echo '  "appId": "${{ env.PACKAGE_NAME }}",' >> capacitor.config.json
          echo '  "appName": "${{ env.APP_NAME }}",' >> capacitor.config.json
          echo '  "webDir": "www",' >> capacitor.config.json
          echo '  "bundledWebRuntime": false,' >> capacitor.config.json
          echo '  "plugins": {' >> capacitor.config.json
          echo '    "SplashScreen": {' >> capacitor.config.json
          echo '      "launchShowDuration": 3000,' >> capacitor.config.json
          echo '      "launchAutoHide": true,' >> capacitor.config.json
          echo '      "backgroundColor": "#001a66",' >> capacitor.config.json
          echo '      "androidSplashResourceName": "splash",' >> capacitor.config.json
          echo '      "androidScaleType": "CENTER_CROP",' >> capacitor.config.json
          echo '      "splashFullScreen": true,' >> capacitor.config.json
          echo '      "splashImmersive": true,' >> capacitor.config.json
          echo '      "showSpinner": false' >> capacitor.config.json
          echo '    }' >> capacitor.config.json
          echo '  }' >> capacitor.config.json
          echo '}' >> capacitor.config.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Initialize Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          
          if [ -f node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js ]; then node node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js; fi
          if [ -f node_modules/capacitor-admob-nextgen/scripts/admob-native.js ]; then node node_modules/capacitor-admob-nextgen/scripts/admob-native.js; fi
          
          sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml

      - name: Inject Custom Notification Layout and Native Code
        run: |
          # 0. EXPOSE ONESIGNAL SDK TO THE APP MODULE
          sed -i '/dependencies {/a \    compileOnly "com.onesignal:OneSignal:5.1.8"' android/app/build.gradle

          # 1. Generate the XML layout file
          mkdir -p android/app/src/main/res/layout
          cat << 'EOF' > android/app/src/main/res/layout/custom_heads_up_notification.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:padding="0dp"
              android:background="#000000">
              <ImageView
                  android:id="@+id/img_main"
                  android:layout_width="match_parent"
                  android:layout_height="140dp"
                  android:scaleType="centerCrop"
                  android:adjustViewBounds="true" />
          </LinearLayout>
          EOF

          # 2. Generate the Java Service File (OneSignal SDK v5)
          mkdir -p android/app/src/main/java/com/maharapro/app
          cat << 'EOF' > android/app/src/main/java/com/maharapro/app/CustomNotificationService.java
          package com.maharapro.app; 
          
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.widget.RemoteViews;
          import androidx.core.app.NotificationCompat;
          
          import com.onesignal.notifications.INotificationReceivedEvent;
          import com.onesignal.notifications.INotificationServiceExtension;
          import com.onesignal.notifications.IMutableNotification;
          
          import java.io.InputStream;
          import java.net.URL;

          public class CustomNotificationService implements INotificationServiceExtension {
              @Override
              public void onNotificationReceived(INotificationReceivedEvent event) {
                  Context context = event.getContext();
                  IMutableNotification mutableNotification = event.getNotification();

                  String customImgUrl = null;
                  if (mutableNotification.getAdditionalData() != null) {
                      customImgUrl = mutableNotification.getAdditionalData().optString("custom_heads_up_image", null);
                  }

                  if (customImgUrl != null) {
                      try {
                          InputStream in = new URL(customImgUrl).openStream();
                          final Bitmap bitmap = BitmapFactory.decodeStream(in);

                          mutableNotification.setExtender(builder -> {
                              RemoteViews customView = new RemoteViews(context.getPackageName(), R.layout.custom_heads_up_notification);
                              customView.setImageViewBitmap(R.id.img_main, bitmap);
                              builder.setCustomHeadsUpContentView(customView);
                              builder.setStyle(new NotificationCompat.DecoratedCustomViewStyle());
                              return builder;
                          });
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }
              }
          }
          EOF

          # 3. Register the Java extension inside AndroidManifest.xml
          sed -i '/<\/application>/i \        <meta-data android:name="com.onesignal.NotificationServiceExtension" android:value="com.maharapro.app.CustomNotificationService" />' android/app/src/main/AndroidManifest.xml

      - name: Set Custom App and Notification Icons
        run: |
          python3 -m pip install --upgrade pillow --quiet

          # Notification icons
          mkdir -p android/app/src/main/res/drawable
          cp s2.png android/app/src/main/res/drawable/ic_stat_onesignal_default.png 2>/dev/null || true
          cp s2.png android/app/src/main/res/drawable/ic_onesignal_large_icon_default.png 2>/dev/null || true

          # Set adaptive icon background color to clean white
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          EOF

          # Generate safe-padded adaptive foreground icons to prevent edge clipping
          python3 - << 'EOF'
          import os
          from PIL import Image

          if os.path.exists("s.png"):
              img = Image.open("s.png").convert("RGBA")
              
              densities = {
                  "mipmap-mdpi": (48, 108),
                  "mipmap-hdpi": (72, 162),
                  "mipmap-xhdpi": (96, 216),
                  "mipmap-xxhdpi": (144, 324),
                  "mipmap-xxxhdpi": (192, 432)
              }
              
              for folder, (icon_sz, fg_sz) in densities.items():
                  target_dir = f"android/app/src/main/res/{folder}"
                  os.makedirs(target_dir, exist_ok=True)
                  
                  # Legacy icons
                  legacy_icon = img.resize((icon_sz, icon_sz), Image.Resampling.LANCZOS)
                  legacy_icon.save(f"{target_dir}/ic_launcher.png")
                  legacy_icon.save(f"{target_dir}/ic_launcher_round.png")
                  
                  # Adaptive foreground: safe zone is 66% of fg_sz
                  fg_canvas = Image.new("RGBA", (fg_sz, fg_sz), (0, 0, 0, 0))
                  safe_sz = int(fg_sz * 0.66)
                  resized_logo = img.resize((safe_sz, safe_sz), Image.Resampling.LANCZOS)
                  offset = ((fg_sz - safe_sz) // 2, (fg_sz - safe_sz) // 2)
                  fg_canvas.paste(resized_logo, offset, resized_logo)
                  fg_canvas.save(f"{target_dir}/ic_launcher_foreground.png")
              print("App icons generated successfully with adaptive safe-zone padding.")
          else:
              print("Warning: s.png not found!")
          EOF

      - name: Fix Kotlin Clashes
        run: |
          echo "" >> android/app/build.gradle
          echo "configurations.all {" >> android/app/build.gradle
          echo "    resolutionStrategy {" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Target Android SDK 36
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          fi
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/minSdk .*/minSdk 24/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle

      - name: Set Version Code and Name
        run: |
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.run_number }}/' android/app/build.gradle
          # Uses the APP_VERSION variable you set at the top of the file
          sed -i 's/versionName "[^"]*"/versionName "${{ env.APP_VERSION }}"/' android/app/build.gradle

      - name: Add Google Services JSON
        run: |
          cat << 'EOF' > android/app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Decode Base64 Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Configure Signing in Gradle
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

      - name: Build Signed Release AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Move & Rename AAB Output
        run: mv android/app/build/outputs/bundle/release/app-release.aab mahara-pro.aab

      - name: Upload Signed Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahara-pro-aab
          path: mahara-pro.aab
