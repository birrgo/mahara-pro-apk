<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Privacy Policy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="news.css">
    <style>
        .page-content-card { 
            background: #0f172a; 
            border-radius: 16px; 
            padding: 24px; 
            margin-bottom: 30px; 
            color: #f8fafc; 
            line-height: 1.8; 
            font-size: 15px; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); 
        }
        .page-content-card h3 { 
            color: #ffffff; 
            margin-top: 25px; 
            margin-bottom: 12px; 
            font-size: 18px; 
            font-weight: 700; 
            border-bottom: 1px solid #334155; 
            padding-bottom: 8px; 
        }
        .page-content-card h3:first-child { margin-top: 0; }
        .page-content-card p { margin-bottom: 16px; color: #cbd5e1; }
        .page-content-card ul { padding-left: 20px; margin-bottom: 16px; color: #cbd5e1; }
        .page-content-card li { margin-bottom: 8px; }
        
        .loader {
            text-align: center;
            color: #94a3b8;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="app-view">
        <header class="nav-header" style="background: #081B38;">
            <div class="header-left-group">
                <a href="index.html" style="color: white; margin-right: 15px; display: flex; align-items: center;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
                <h1 class="header-title-text" style="font-size: 18px;">Privacy Policy</h1>
            </div>
        </header>

        <main class="app-content" style="padding-top: 80px;">
            <div id="privacy-container" class="page-content-card">
                <div class="loader" id="loading-indicator">Loading Privacy Policy...</div>
            </div>
        </main>
    </div>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqwgwiukwKb7o6gwnaLoPQSWc7BfMDuYQ",
            authDomain: "besuad.firebaseapp.com",
            databaseURL: "https://besuad-default-rtdb.firebaseio.com",
            projectId: "besuad",
            storageBucket: "besuad.firebasestorage.app",
            messagingSenderId: "641705823615",
            appId: "1:641705823615:web:6502b2511ff8c0f251de4a",
            measurementId: "G-2YSX71N08Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Listen to app5 privacy policy data
        const privacyRef = ref(db, 'app5/privacyPolicy/content');
        const container = document.getElementById('privacy-container');
        
        onValue(privacyRef, (snapshot) => {
            if (snapshot.exists()) {
                container.innerHTML = snapshot.val();
            } else {
                container.innerHTML = "<p>Privacy policy is currently being updated. Please check back later.</p>";
            }
        }, (error) => {
            container.innerHTML = "<p>Error loading policy. Please check your connection.</p>";
            console.error("Firebase Read Error:", error);
        });
    </script>
</body>
</html>
